name: Polymarket daily new-questions fetch

on:
  schedule:
    # 04:00 UTC = 08:00 Asia/Dubai (GST, UTC+4, no DST) — every day
    - cron: "0 4 * * *"
  workflow_dispatch:        # lets you run it on demand from the Actions tab

permissions:
  contents: write

concurrency:
  group: polymarket-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch new questions
        working-directory: polymarket
        run: python3 fetch_new_questions.py

      - name: Commit refreshed data
        run: |
          git config user.name  "polymarket-bot"
          git config user.email "actions@github.com"
          git add polymarket/data.json polymarket/data.js
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
          else
            git commit -m "chore(polymarket): daily new-questions refresh [skip ci]"
            git push
          fi

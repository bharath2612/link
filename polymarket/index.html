<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Question Wire — new Polymarket questions, daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600;9..144,900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f4efe6;
    --paper-deep: #ece5d8;
    --ink: #1c1a16;
    --ink-soft: #5c564b;
    --ink-faint: #8f8778;
    --rule: #d8cfbe;
    --up: #0d7a4f;
    --up-bg: #e2efe4;
    --down: #b3391f;
    --accent: #b3391f;
    --serif: "Fraunces", Georgia, serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    line-height: 1.45;
    /* subtle paper grain */
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(255,255,255,.5), transparent 55%),
      repeating-linear-gradient(0deg, transparent 0 2px, rgba(28,26,22,.012) 2px 4px);
  }

  .sheet { max-width: 880px; margin: 0 auto; padding: 0 24px 96px; }

  /* ---------- masthead ---------- */
  header { padding-top: 40px; }
  .topline {
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: var(--mono); font-size: 11px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--ink-soft);
    border-bottom: 1px solid var(--ink); padding-bottom: 8px;
  }
  .topline .dot { color: var(--accent); }
  h1 {
    font-size: clamp(52px, 11vw, 118px);
    font-weight: 900; font-variation-settings: "opsz" 144;
    letter-spacing: -.03em; line-height: .92;
    padding: 22px 0 10px; text-wrap: balance;
  }
  h1 em { font-style: italic; font-weight: 300; }
  .subline {
    display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline;
    justify-content: space-between;
    border-top: 3px double var(--ink); border-bottom: 1px solid var(--ink);
    padding: 10px 0; margin-bottom: 8px;
    font-size: 15px; color: var(--ink-soft); font-style: italic;
  }
  .subline .stamp { font-family: var(--mono); font-style: normal; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
  .stamp b { color: var(--accent); font-weight: 600; }
  .controls { display: flex; align-items: center; gap: 16px; }
  #refresh {
    font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink); background: transparent;
    border: 1px solid var(--ink); border-radius: 2px;
    padding: 6px 12px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px;
    transition: background .18s ease, color .18s ease;
  }
  #refresh:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
  #refresh:disabled { opacity: .5; cursor: progress; }
  #refresh .ico { font-size: 14px; display: inline-block; }
  #refresh.spin .ico { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #refresh.ok { border-color: var(--up); color: var(--up); }
  #refresh.err { border-color: var(--down); color: var(--down); }

  /* ---------- day sections ---------- */
  .day { margin-top: 52px; }
  .dayhead {
    position: sticky; top: 0; z-index: 5;
    background: var(--paper);
    display: flex; align-items: baseline; gap: 14px;
    padding: 10px 0 6px; border-bottom: 2px solid var(--ink);
  }
  .dayhead h2 { font-size: 21px; font-weight: 600; font-style: italic; }
  .dayhead .count {
    font-family: var(--mono); font-size: 11px; color: var(--ink-faint);
    letter-spacing: .1em; text-transform: uppercase;
  }
  .dayhead .line { flex: 1; }

  /* ---------- question rows ---------- */
  .q {
    display: grid;
    grid-template-columns: 58px 1fr auto;
    gap: 4px 18px;
    padding: 20px 8px 18px 0;
    border-bottom: 1px solid var(--rule);
    text-decoration: none; color: inherit;
    position: relative;
    transition: background .18s ease;
  }
  .q:hover { background: var(--paper-deep); }
  .q:hover .num { color: var(--accent); }
  .q::after {
    content: "→";
    position: absolute; right: 6px; top: 22px;
    font-family: var(--mono); font-size: 14px; color: var(--accent);
    opacity: 0; transform: translateX(-6px);
    transition: opacity .18s ease, transform .18s ease;
  }
  .q:hover::after { opacity: 1; transform: translateX(0); }

  .num {
    grid-row: 1 / 3;
    font-family: var(--mono); font-size: 12px; color: var(--ink-faint);
    padding-top: 6px; transition: color .18s ease;
  }
  .num .t { display: block; margin-top: 5px; font-size: 10px; }

  .q h3 {
    font-size: clamp(19px, 2.6vw, 24px);
    font-weight: 600; letter-spacing: -.01em; line-height: 1.22;
    padding-right: 28px; text-wrap: balance;
  }
  .meta {
    grid-column: 2;
    display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
    margin-top: 7px;
    font-family: var(--mono); font-size: 11px; color: var(--ink-soft);
  }
  .tag { letter-spacing: .08em; text-transform: uppercase; }
  .tag + .tag::before { content: "· "; color: var(--ink-faint); }
  .vol { color: var(--ink-faint); }

  /* read / unread badge */
  .badge {
    font-family: var(--mono); font-size: 9.5px; font-weight: 600;
    letter-spacing: .12em; text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 8px 2px 6px; border-radius: 999px; white-space: nowrap;
  }
  .badge::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
  }
  .badge.unread { color: var(--accent); background: rgba(179,57,31,.09); }
  .badge.unread::before { background: var(--accent); box-shadow: 0 0 0 3px rgba(179,57,31,.15); }
  .badge.read { color: var(--ink-faint); background: transparent; }
  .badge.read::before { background: transparent; border: 1px solid var(--ink-faint); }
  /* whole row dims once read */
  .q.is-read h3 { color: var(--ink-soft); font-weight: 400; }
  .q.is-read .thumb { opacity: .6; }

  .odds {
    grid-column: 2; margin-top: 9px;
    display: flex; flex-wrap: wrap; gap: 6px;
  }
  .chip {
    font-family: var(--mono); font-size: 11.5px; font-weight: 500;
    border: 1px solid var(--rule); border-radius: 999px;
    padding: 3px 10px; background: rgba(255,255,255,.45);
    color: var(--ink-soft);
    max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .chip b { font-weight: 600; color: var(--up); }
  .chip.lead { border-color: var(--up); background: var(--up-bg); color: var(--ink); }

  .thumb {
    grid-row: 1 / 3; grid-column: 3; align-self: start;
    width: 76px; height: 76px; object-fit: cover;
    border: 1px solid var(--rule);
    filter: saturate(.85) contrast(.95) sepia(.08);
    margin-right: 18px;
  }

  /* staggered entrance */
  .day { animation: rise .5s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  footer {
    margin-top: 72px; padding-top: 14px; border-top: 3px double var(--ink);
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
    font-family: var(--mono); font-size: 11px; color: var(--ink-faint);
    letter-spacing: .08em; text-transform: uppercase;
  }
  footer a { color: var(--ink-soft); }

  .empty {
    margin-top: 80px; text-align: center; font-style: italic;
    color: var(--ink-soft); font-size: 19px;
  }
  .empty code { font-family: var(--mono); font-style: normal; font-size: 14px; background: var(--paper-deep); padding: 2px 8px; }

  @media (max-width: 560px) {
    .q { grid-template-columns: 1fr; }
    .num { grid-row: auto; display: flex; gap: 10px; padding-top: 0; }
    .num .t { margin-top: 0; }
    .thumb { display: none; }
  }
</style>
</head>
<body>
<div class="sheet">
  <header>
    <div class="topline">
      <span>Vol. I <span class="dot">●</span> Prediction Markets Desk</span>
      <span id="today-date">—</span>
    </div>
    <h1>The Question <em>Wire</em></h1>
    <div class="subline">
      <span>Every genuinely new question opened on Polymarket — machine-made recurring markets filtered out.</span>
      <span class="controls">
        <button id="refresh" title="Fetch the latest questions live from Polymarket">
          <span class="ico">↻</span><span class="lbl">Refresh</span>
        </button>
        <span class="stamp" id="stamp">— questions on file</span>
      </span>
    </div>
  </header>

  <main id="feed">
    <p class="empty">No data captured yet.<br><br>Hit <code>Refresh</code> to pull live questions from Polymarket.</p>
  </main>

  <footer>
    <span>Source: gamma-api.polymarket.com</span>
    <span id="generated">—</span>
  </footer>
</div>

<script src="data.js"></script>
<script>
  const fmtDay = iso => new Date(iso).toLocaleDateString("en-US",
    { weekday: "long", month: "long", day: "numeric" });
  const fmtTime = iso => new Date(iso).toLocaleTimeString([],
    { hour: "2-digit", minute: "2-digit" });
  const fmtVol = v => v >= 1e6 ? "$" + (v / 1e6).toFixed(1) + "M"
                    : v >= 1e3 ? "$" + (v / 1e3).toFixed(1) + "K"
                    : "$" + Math.round(v);
  const pct = p => Math.round(p * 100) + "%";

  document.getElementById("today-date").textContent =
    new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });

  // ---------- read / unread persistence ----------
  const READ_KEY = "wire-read";
  const readSet = new Set(JSON.parse(localStorage.getItem(READ_KEY) || "[]"));
  function markRead(id) {
    if (readSet.has(id)) return;
    readSet.add(id);
    localStorage.setItem(READ_KEY, JSON.stringify([...readSet]));
  }

  function render(payload) {
    const feed = document.getElementById("feed");
    const qs = payload.questions || [];
    if (!qs.length) return;

    const unread = qs.filter(q => !readSet.has(q.id)).length;
    document.getElementById("stamp").innerHTML =
      `<b>${unread}</b> unread · ${qs.length} on file`;
    document.getElementById("generated").textContent =
      "captured " + new Date(payload.generatedAt).toLocaleString();

    const byDay = new Map();
    for (const q of qs) {
      const day = q.createdAt.slice(0, 10);
      if (!byDay.has(day)) byDay.set(day, []);
      byDay.get(day).push(q);
    }

    feed.innerHTML = "";
    let dayIdx = 0;
    for (const [day, items] of byDay) {
      const sec = document.createElement("section");
      sec.className = "day";
      sec.style.animationDelay = Math.min(dayIdx * 90, 400) + "ms";
      sec.innerHTML = `
        <div class="dayhead">
          <h2>${fmtDay(day + "T12:00:00Z")}</h2>
          <span class="line"></span>
          <span class="count">${items.length} new</span>
        </div>`;
      items.forEach((q, i) => {
        const isRead = readSet.has(q.id);
        const a = document.createElement("a");
        a.className = "q" + (isRead ? " is-read" : "");
        a.href = "https://polymarket.com/event/" + q.slug;
        a.target = "_blank";
        a.rel = "noopener";
        a.dataset.id = q.id;
        const chips = (q.outcomes || []).map(([name, p], j) =>
          `<span class="chip${j === 0 ? " lead" : ""}">${esc(name)} <b>${pct(p)}</b></span>`
        ).join("");
        a.innerHTML = `
          <span class="num">№ ${String(i + 1).padStart(2, "0")}<span class="t">${fmtTime(q.createdAt)}</span></span>
          <h3>${esc(q.title)}</h3>
          ${q.image ? `<img class="thumb" src="${esc(q.image)}" alt="" loading="lazy" onerror="this.remove()">` : ""}
          <div class="meta">
            <span class="badge ${isRead ? "read" : "unread"}">${isRead ? "Read" : "New"}</span>
            ${(q.tags || []).slice(0, 3).map(t => `<span class="tag">${esc(t)}</span>`).join("")}
            ${q.nMarkets > 1 ? `<span class="vol">${q.nMarkets} outcomes</span>` : ""}
            <span class="vol">${fmtVol(q.volume)} vol</span>
          </div>
          ${chips ? `<div class="odds">${chips}</div>` : ""}`;
        a.addEventListener("click", () => {
          markRead(q.id);
          a.classList.add("is-read");
          const b = a.querySelector(".badge");
          if (b) { b.className = "badge read"; b.textContent = "Read"; }
          const unreadNow = (state.questions || []).filter(x => !readSet.has(x.id)).length;
          document.getElementById("stamp").innerHTML =
            `<b>${unreadNow}</b> unread · ${(state.questions || []).length} on file`;
        });
        sec.appendChild(a);
      });
      feed.appendChild(sec);
      dayIdx++;
    }
  }

  const esc = s => String(s).replace(/[&<>"']/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---------- live in-browser refresh ----------
  // Mutable page state, seeded from the committed data.js snapshot.
  const state = window.QUESTIONS || { generatedAt: new Date().toISOString(), questions: [] };
  const KEEP_DAYS = 14;
  const GAMMA = "https://gamma-api.polymarket.com";

  // Shape one Gamma event into the same slim record the Python fetcher writes.
  function slim(ev) {
    const markets = ev.markets || [];
    let outcomes = [];
    try {
      if (markets.length === 1) {
        const names = JSON.parse(markets[0].outcomes || "[]");
        const prices = JSON.parse(markets[0].outcomePrices || "[]");
        outcomes = names.map((n, i) => [n, parseFloat(prices[i])]);
      } else {
        outcomes = markets.map(m => {
          const prices = JSON.parse(m.outcomePrices || "[0]");
          return [m.groupItemTitle || m.question || "", parseFloat(prices[0])];
        });
      }
      outcomes.sort((a, b) => b[1] - a[1]);
    } catch { outcomes = []; }
    return {
      id: String(ev.id),
      title: ev.title || "",
      slug: ev.slug || "",
      createdAt: ev.createdAt || "",
      endDate: ev.endDate || "",
      image: ev.image || ev.icon || "",
      volume: parseFloat(ev.volume || 0),
      tags: (ev.tags || []).slice(0, 4).map(t => t.label || ""),
      outcomes: outcomes.slice(0, 3),
      nMarkets: markets.length,
    };
  }

  // Genuinely new question = not part of a recurring series / not "Hide From New".
  function isNew(ev) {
    if (ev.series && ev.series.length) return false;
    const slugs = new Set((ev.tags || []).map(t => t.slug));
    return !slugs.has("recurring") && !slugs.has("hide-from-new");
  }

  async function refresh() {
    const btn = document.getElementById("refresh");
    const lbl = btn.querySelector(".lbl");
    btn.disabled = true; btn.className = "spin"; lbl.textContent = "Fetching…";
    try {
      const seen = {};
      for (let page = 0; page < 5; page++) {
        const url = `${GAMMA}/events?limit=100&offset=${page * 100}` +
          `&order=createdAt&ascending=false&active=true&closed=false&exclude_tag_id=102169`;
        const res = await fetch(url, { headers: { "Accept": "application/json" } });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const events = await res.json();
        if (!events.length) break;
        for (const ev of events) if (isNew(ev)) { const q = slim(ev); seen[q.id] = q; }
      }

      // Merge with existing, drop anything older than KEEP_DAYS, sort newest-first.
      const merged = {};
      for (const q of state.questions) merged[q.id] = q;
      Object.assign(merged, seen);
      const cutoff = new Date(Date.now() - KEEP_DAYS * 864e5).toISOString();
      state.questions = Object.values(merged)
        .filter(q => q.createdAt >= cutoff)
        .sort((a, b) => a.createdAt < b.createdAt ? 1 : -1);
      state.generatedAt = new Date().toISOString();

      render(state);
      const n = Object.keys(seen).length;
      btn.className = "ok"; lbl.textContent = n ? `Updated · ${n} live` : "Up to date";
    } catch (err) {
      btn.className = "err";
      lbl.textContent = "Blocked — see note";
      console.error("[wire] refresh failed:", err);
      document.getElementById("generated").textContent =
        "live refresh blocked here (" + err.message + ") — cron still updates daily";
    } finally {
      btn.disabled = false;
      setTimeout(() => {
        btn.className = ""; lbl.textContent = "Refresh";
      }, 4000);
    }
  }

  document.getElementById("refresh").addEventListener("click", refresh);
  render(state);
</script>
</body>
</html>
